<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CMC Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5F9;--sf:#fff;--ink:#1E293B;--mute:#566377;--line:#DDE4EC;--ac:#0369A1;--on:#fff;--soft:#E0F2FE;--cy:#38BDF8;--sl:#334155;--warn:#B45309;--ok:#047857;--bad:#B91C1C;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0F172A;--sf:#1B2638;--ink:#F1F5F9;--mute:#9AA9BE;--line:#2B3A50;--ac:#38BDF8;--on:#0F172A;--soft:#12324A;--warn:#FBBF24;--ok:#34D399;--bad:#F87171;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F172A;--sf:#1B2638;--ink:#F1F5F9;--mute:#9AA9BE;--line:#2B3A50;--ac:#38BDF8;--on:#0F172A;--soft:#12324A;--warn:#FBBF24;--ok:#34D399;--bad:#F87171;color-scheme:dark}}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Plus Jakarta Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--sf);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-size:17px;font-weight:800;line-height:1.1;display:block}
.brand small{display:block;color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.sp{flex:1}
.lkx{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--ac);font-weight:600;text-decoration:none;font-size:13px;background:var(--sf)}
.ft a.lkx{margin:0}
.mk{width:40px;height:40px;border-radius:8px;background:#fff;flex:none}
.logo{display:block;margin:0 auto 14px;width:100%;max-width:300px;border-radius:14px;background:#fff}
.ib,.sel{height:40px;border:1px solid var(--line);background:var(--bg);border-radius:var(--rs,10px);padding:0 10px;width:auto}
.ib{min-width:40px;display:inline-grid;place-items:center;padding:0}
.me{display:none;align-items:center;gap:8px;font-weight:600;font-size:13px}

.shell{max-width:1100px;margin:0 auto;padding:18px 16px 110px;display:grid;gap:20px}
.shell.na{max-width:520px}
.nav{position:fixed;inset-inline:0;bottom:0;z-index:25;display:flex;background:var(--sf);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;border-radius:10px;padding:6px 1px;font-size:10.5px;font-weight:600;color:var(--mute)}
.nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button.on{color:var(--ac);background:var(--soft)}

h1{font-size:clamp(24px,4vw,32px);line-height:1.15;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 10px}
.lead{color:var(--mute);margin:0 0 16px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r,14px);padding:16px}
.stack{display:grid;gap:12px}
.grid{display:grid;gap:12px}

.grid.c4{grid-template-columns:1fr 1fr}

.stat b{display:block;font-size:28px;font-weight:800;color:var(--ac);line-height:1.1}
.prio{background:var(--sl);color:#F1F5F9;border-inline-start:6px solid var(--cy);border-radius:var(--r,14px);padding:16px 18px;display:flex;gap:14px;margin-bottom:16px}
.prio h2{font-size:19px;margin:2px 0 6px}.prio p{margin:0;color:#CBD5E1}.prio .i{color:var(--cy);width:26px;height:26px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--ac)}
.tag.u{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.tag.ok{color:var(--ok)}.tag.no{color:var(--bad)}
.meta{color:var(--mute);font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:var(--rs,10px);background:var(--ac);color:var(--on);font-weight:700;padding:9px 16px;display:inline-flex;gap:8px;align-items:center;min-height:40px}
.btn.g{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.done{background:var(--soft);color:var(--ok)}
.btn.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.s{padding:4px 10px;min-height:32px;font-size:13px}
.item h3{margin:6px 0 4px;font-size:16px;line-height:1.3}.item p{margin:0 0 10px;color:var(--mute)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--rs,10px);padding:10px 12px;min-height:42px}
label{display:grid;gap:4px;font-size:13px;font-weight:600}
label.ck{display:flex;gap:8px;align-items:center}label.ck input{width:20px;min-height:20px}
.sel{width:auto}
.split{display:grid;gap:14px}

.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:none;display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--sf);border-radius:var(--rs,10px);padding:9px 12px;font-weight:600;text-align:start}
.tabs button.on{background:var(--soft);color:var(--ac);border-color:var(--ac)}
.roles{display:grid;gap:8px}
.roles button{display:flex;gap:12px;align-items:center;text-align:start;border:2px solid var(--line);background:var(--sf);border-radius:12px;padding:10px 12px}
.roles button.on{border-color:var(--ac);background:var(--soft)}
.roles small{display:block;color:var(--mute);font-weight:400}
.err{color:var(--bad);font-weight:600;margin:0}
.chat{display:flex;flex-direction:column;gap:10px;height:min(52vh,520px);overflow:auto;margin-bottom:12px;padding:2px}
.m{background:var(--bg);padding:8px 12px;border-radius:12px;max-width:88%;overflow-wrap:anywhere}
.m b{font-size:12px;color:var(--mute)}
.m.me{align-self:flex-end;background:var(--soft)}
.m img,.m video{max-width:100%;max-height:260px;border-radius:8px;display:block;margin-top:6px}
.m audio{max-width:100%;margin-top:6px}
.fl{display:inline-flex;gap:8px;align-items:center;margin-top:6px;color:var(--ac);font-weight:600;text-decoration:none}
.comp{display:flex;gap:6px;align-items:center}
.emo{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg)}
.emo button{border:0;background:none;font-size:22px;padding:4px 6px;border-radius:8px}
.rec{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important}
details{border-bottom:1px solid var(--line);padding:10px 0}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.ft{border-top:1px solid var(--line);padding:22px 16px 120px;text-align:center;color:var(--mute);font-size:13px}
.ft a{color:var(--ac);font-weight:700;display:inline-flex;gap:6px;align-items:center;margin:0 10px;text-decoration:none}

#toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin:auto;max-width:360px;background:var(--sl);color:#fff;padding:11px 16px;border-radius:12px;text-align:center;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
#toast.show{opacity:1}
.call{position:fixed;inset:0;z-index:70;background:#0B1220;color:#fff;display:flex;flex-direction:column;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.tiles{flex:1;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));grid-auto-rows:minmax(120px,1fr);overflow:auto}
.tile{position:relative;background:#1E293B;border-radius:14px;overflow:hidden;display:grid;place-items:center}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av{width:64px;height:64px;border-radius:50%;background:#334155;color:#38BDF8;display:grid;place-items:center;font-weight:800;font-size:22px}
.nm{position:absolute;inset-inline-start:8px;bottom:8px;background:rgba(0,0,0,.55);padding:2px 10px;border-radius:8px;font-size:12px}
.ctl{display:flex;justify-content:center;gap:12px}
.ctl button{width:54px;height:54px;border-radius:50%;border:0;background:#334155;color:#fff;display:grid;place-items:center}
.ctl button.off{background:#F1F5F9;color:#0F172A}
.ctl .lv{background:#DC2626}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.hb{position:absolute;width:4px;border-radius:2px;background:#3A3A44}

.sb span{display:flex;gap:6px;align-items:center}
.notch{position:absolute;top:0;left:50%;width:162px;height:33px;margin-left:-81px;background:#0A0A0D;border-radius:0 0 22px 22px;z-index:100}
.hi{position:absolute;bottom:8px;left:50%;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:#fff;mix-blend-mode:difference;z-index:100;pointer-events:none}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-top:47px;scrollbar-width:none;background:var(--bg);color:var(--ink)}
.screen::-webkit-scrollbar{display:none}
.hd{position:relative;top:0}.brand small{max-width:120px}.chat{height:360px}
.nav{padding-bottom:26px}.ft{padding-bottom:130px}
#toast{bottom:108px}.call{padding-top:59px;padding-bottom:30px;z-index:90}
#main{zoom:var(--z,1)}
.avb,.avl{border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--soft);color:var(--ac);font-weight:800;border:2px solid var(--line);padding:0;flex:none}
.avb{width:40px;height:40px}.avb.on{border-color:var(--ac)}
.avl{width:96px;height:96px;font-size:36px;margin:0 auto}
.avb img,.avl img{width:100%;height:100%;object-fit:cover}
.pfh{text-align:center}
.seg{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:var(--rs,10px);border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;border-radius:calc(var(--rs,10px) - 2px);padding:8px 4px;font-weight:600;color:var(--mute);display:flex;gap:6px;align-items:center;justify-content:center;font-size:13px}
.seg button.on{background:var(--ac);color:var(--on)}
.swr{display:flex;flex-wrap:wrap;gap:10px}
.swb{width:38px;height:38px;border-radius:50%;border:3px solid var(--sf);box-shadow:0 0 0 2px var(--line);display:grid;place-items:center;color:#fff;padding:0;position:relative}
.swb.on{box-shadow:0 0 0 2px var(--ac)}
.swb.cu{background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red);overflow:hidden}
.swb.cu input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;padding:0;cursor:pointer}

.dev{position:static;width:auto;height:auto;margin:0;transform:none}
.phone{position:fixed;inset:0;border-radius:0;box-shadow:none;transform:none}
.sb,.notch,.hi,.hb{display:none}
.screen{padding-top:0}.hd{top:0}
.nav{padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
#toast{bottom:90px}.call{padding-top:24px;padding-bottom:24px}
body{background:var(--bg)}
html{-webkit-text-size-adjust:100%}
button,label,a,select,.li{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{-webkit-user-select:none;user-select:none}
input,textarea,select{font-size:16px}
.btn,.nav button,.avb,.swb,.seg button,.tabs button{transition:transform .12s ease,background-color .2s ease,opacity .2s}
.btn:active,.nav button:active,.avb:active,.swb:active,.seg button:active,.tabs button:active{transform:scale(.96)}
.screen{overscroll-behavior:contain;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
body.kb .nav{display:none!important}
.vin{animation:fi .22s ease both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

    else if(m.k==='aud')c=`<audio controls src="${m.src}"></audio>`;
    else if(m.k==='file')c=`<a class="fl" href="${m.src}" download="${esc(m.name)}">${ic('file')}${esc(m.name)} · ${kb(m.sz)}</a>`;
    else c=`<div>${tx(m.t)}</div>`;
    return `<div class="m ${m.u===nm()?'me':''}"><b>${esc(m.u)} · ${roleName(m.r)} · ${esc(m.tm)}</b>${c}${rl()==='a'?` <button class="btn bad s" data-a="delmsg" data-v="${S.g}" data-w="${i}" aria-label="${t('del')}">${ic('trash')}</button>`:''}</div>`}).join('');
  return head('fo','fo_s')+`<div class="split"><div class="tabs">${S.groups.map((x,i)=>`<button class="${S.g===i?'on':''}" data-a="grp" data-v="${i}">${ic('msg')}${esc(p(x.n).split(' · ')[0])}</button>`).join('')}</div>
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><b>${esc(p(g.n))}</b><button class="btn s" data-a="call">${ic('video')}${t('cl')}</button></div>
  <div class="chat" id="chat">${body}</div>
  ${S.emo?`<div class="emo">${EMO.map(e=>`<button data-a="emo" data-v="${e}" aria-label="${e}">${e}</button>`).join('')}</div>`:''}
  ${S.rec?`<p class="err">${t('rc')}</p>`:''}
  <div class="comp"><button class="ib" data-a="emot" aria-label="emoji">${ic('smile')}</button>
  <label class="ib" style="cursor:pointer" aria-label="attach">${ic('clip')}<input id="fl" type="file" hidden accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx"></label>
  <button class="ib ${S.rec?'rec':''}" data-a="mic" aria-label="voice">${ic(S.rec?'stop':'mic')}</button>
  <input id="msg" placeholder="${esc(t('ph'))}" value="${fv('msg')}" aria-label="${esc(t('ph'))}"><button class="btn" data-a="send" aria-label="${t('snd')}">${ic('send')}</button></div></div></div>`;
},
clubs(){
  return head('cb','cb_s')+`<div class="grid c2">${S.clubs.map((c,i)=>{const mm=c.mem.includes(nm()),own=c.ow===nm();return `<article class="card item"><div class="row"><span class="tag">${t(c.ty==='c'?'tc':'tg')}</span><span class="meta">${c.mem.length} ${t('mb')}</span></div><h3>${esc(c.n)}</h3><p>${tx(c.d)}</p><div class="row">${own?`<span class="tag ok">${t('ow')}</span><button class="btn bad s" data-a="delclub" data-v="${i}">${ic('trash')}${t('del')}</button>`:`<button class="btn ${mm?'done':''}" data-a="joinclub" data-v="${i}">${mm?ic('check')+t('mem'):ic('plus')+t('jn')}</button>`}</div></article>`}).join('')}</div>
  ${rl()!=='a'?card(t('nw'),`<div class="grid c2">${inp('cn',t('cn'))}<label>${t('ct')}<select id="ct"><option value="c">${t('tc')}</option><option value="g" ${S.f.ct==='g'?'selected':''}>${t('tg')}</option></select></label></div><label style="margin:10px 0">${t('cd')}<input id="cd" value="${fv('cd')}"></label><button class="btn" data-a="mkclub">${ic('plus')}${t('nw')}</button>`).replace('<section class="card">','<section class="card" style="margin-top:16px">'):''}`;
},
work(){
  return head('n_work','jb')+`<div class="stack">${JOBS.map((j,i)=>`<article class="card item"><span class="meta">${esc(j.co)} · ${esc(j.c)} · ${j.m} ${t('mo')}</span><h3>${esc(p(j.h))}</h3><button class="btn ${S.applied[i]?'done':''}" data-a="apply" data-v="${i}">${S.applied[i]?ic('check')+t('apd'):ic('case')+t('ap')}</button></article>`).join('')}</div>
  <h2 style="margin:22px 0 10px">${t('gg')}</h2><section class="card" style="margin-bottom:12px"><div class="grid c2">${inp('gt',t('gt'))}${inp('gb',t('gb'),'number')}</div><p><button class="btn" data-a="mkgig">${t('po')}</button></p></section>
  <div class="stack">${S.gigs.map((g,i)=>`<article class="card item"><div class="row"><span class="tag">${g.p} MAD</span><span class="meta">${t('by')} ${esc(g.me?nm():g.u)}</span></div><h3>${tx(g.h)}</h3>${g.me?'':`<button class="btn ${S.offered[i]?'done':'g'}" data-a="offer" data-v="${i}">${S.offered[i]?ic('check')+t('ofd'):ic('wallet')+t('of')}</button>`}</article>`).join('')}</div>`;
},
rdv(){
  const list=rl()==='a'?S.appts:S.appts.filter(a=>a.u===nm());
  const st={p:'st_p',a:'st_a',r:'st_r'};
  return head('rv','rv_s')+(rl()==='a'?'':card(t('rv'),`<div class="grid c2"><label>${t('sv')}<select id="sv">${SVC.map((s,i)=>`<option value="${i}" ${String(S.f.sv)===String(i)?'selected':''}>${esc(p(s))}</option>`).join('')}</select></label>${inp('rd',t('dt'),'date')}<label>${t('sl')}<select id="rs">${SLOTS.map(s=>`<option ${S.f.rs===s?'selected':''}>${s}</option>`).join('')}</select></label>${inp('rw',t('wy'))}</div><p><button class="btn" data-a="book">${ic('check')}${t('cf')}</button></p>`))
  +`<div class="stack" style="margin-top:16px">${list.map(a=>`<article class="card item"><div class="row"><span class="tag ${a.st==='a'?'ok':a.st==='r'?'no':''}">${t(st[a.st])}</span><span class="meta">${esc(a.d)} · ${esc(a.s)} · ${esc(a.u)}</span></div><h3>${esc(p(SVC[a.v]))}</h3><p>${esc(a.w)}</p>${rl()==='a'&&a.st==='p'?`<div class="row"><button class="btn s" data-a="rvok" data-v="${S.appts.indexOf(a)}">${t('ok')}</button><button class="btn bad s" data-a="rvno" data-v="${S.appts.indexOf(a)}">${t('no')}</button></div>`:''}</article>`).join('')||emp()}</div>`;
}
};
const NAVS={s:[['dash','home'],['ann','bell'],['forum','msg'],['clubs','users'],['work','case'],['rdv','cal']],t:[['dash','home'],['ann','bell'],['forum','msg'],['clubs','users']],a:[['dash','home'],['ann','bell'],['forum','msg'],['clubs','users'],['rdv','cal']]};

/* ---------- Rendu ---------- */
let LH='',LK='';
function render(){
  const sc0=$('#scr').scrollTop,oc=$('#chat'),near=!oc||oc.scrollHeight-oc.scrollTop-oc.clientHeight<90;const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart,h=document.documentElement;
  h.lang=S.lang;h.dir=S.lang==='ar'?'rtl':'ltr';h.dataset.theme=S.theme==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):S.theme;applyTheme();
  const u=S.user;if(u&&!NAVS[u.role].some(n=>n[0]===S.view)&&S.view!=='pf')S.view='dash';
  $('#shell').className='shell'+(u?'':' na');
  $('#sub').textContent=t('sub');$('#lang').value=S.lang;
  
  const pb=$('#pfb');pb.hidden=!u;pb.className='avb'+(S.view==='pf'?' on':'');pb.innerHTML=u?avatar(u):'';pb.setAttribute('aria-label',t('pf'));
  $('#who').innerHTML=u?`<span class="tag">${roleName(u.role)}</span> ${esc(u.name)}`:'';
  $('#nav').style.display=u?'':'none';
  if(u)$('#nav').innerHTML=NAVS[u.role].map(([v,i])=>`<button class="${S.view===v?'on':''}" data-a="view" data-v="${v}" ${S.view===v?'aria-current="page"':''}>${ic(i)}<span>${t('n_'+v)}</span></button>`).join('');
  const hm=u?V[S.view]():V.auth(),mn=$('#main'),key=S.view+'|'+S.g+'|'+!!u,chg=key!==LK;
  if(hm!==LH){mn.innerHTML=hm;LH=hm}
  if(chg){LK=key;mn.classList.remove('vin');void mn.offsetWidth;mn.classList.add('vin')}else $('#scr').scrollTo({top:sc0,behavior:'instant'});
  $('#ftl').innerHTML=`<strong>${t('lk')}</strong><div class="row" style="justify-content:center;margin-top:10px">${linksHTML()}</div>`;
  $('#ftt').textContent=t('ft');
  if(id){const e=document.getElementById(id);if(e&&e.type!=='file'){e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}
  const c=$('#chat');if(c&&(near||chg))c.scrollTop=c.scrollHeight;
}
let tm;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>e.classList.remove('show'),2600)}
const post=m=>S.groups[S.g].msgs.push(Object.assign({u:nm(),r:rl(),tm:now()},m));

/* ---------- Enregistrement vocal ---------- */
let rec,chunks=[];
async function toggleRec(){
  if(S.rec){rec.stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(st);chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{st.getTracks().forEach(x=>x.stop());S.rec=false;post({k:'aud',src:URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}))});render()};
    rec.start();S.rec=true;render()}catch(e){toast(t('nomic'))}
}

/* ---------- Visioconférence (caméra, micro, partage d’écran) ---------- */
async function startCall(title){
  if($('#call'))return;
  const o=document.createElement('div');o.className='call';o.id='call';o.setAttribute('role','dialog');
  const ppl=['M. Alaoui','Salma B.','Yassine E.'].filter(x=>x!==nm());
  o.innerHTML=`<div class="row"><b>${esc(title)}</b><span class="meta" id="cst" style="color:#94A3B8"></span></div>
  <div class="tiles"><div class="tile"><span class="av">${esc(nm().slice(0,1))}</span><video id="lv" autoplay muted playsinline></video><span class="nm">${t('you')}</span></div>${ppl.map(x=>`<div class="tile"><span class="av">${esc(x.replace(/^M\. /,'').slice(0,1))}</span><span class="nm">${esc(x)}</span></div>`).join('')}</div>
  <div class="ctl"><button data-c="mic" aria-label="${t('mu')}">${ic('mic')}</button><button data-c="cam" aria-label="${t('cm')}">${ic('video')}</button><button data-c="scr" aria-label="${t('sh')}">${ic('mon')}</button><button class="lv" data-c="end" aria-label="${t('lv')}">${ic('x')}</button></div>`;
  document.querySelector('.phone').appendChild(o);
  let st=null,scr=null;const lv=o.querySelector('#lv');
  try{st=await navigator.mediaDevices.getUserMedia({video:true,audio:true});lv.srcObject=st}catch(e){o.querySelector('#cst').textContent=t('nocam')}
  const back=()=>{scr=null;lv.srcObject=st;o.querySelector('[data-c=scr]').classList.remove('off')};
  o.addEventListener('click',async e=>{const b=e.target.closest('[data-c]');if(!b)return;const c=b.dataset.c;
    if(c==='mic'||c==='cam'){if(st){st[c==='mic'?'getAudioTracks':'getVideoTracks']().forEach(x=>x.enabled=!x.enabled)}b.classList.toggle('off')}
    else if(c==='scr'){if(scr){scr.getTracks().forEach(x=>x.stop());back()}else{try{scr=await navigator.mediaDevices.getDisplayMedia({video:true});lv.srcObject=scr;b.classList.add('off');scr.getVideoTracks()[0].onended=back}catch(x){}}}
    else{[st,scr].forEach(s=>s&&s.getTracks().forEach(x=>x.stop()));o.remove()}});
}

/* ---------- Actions ---------- */
const A={
view:v=>{S.view=v;$('#scr').scrollTo({top:0})},
openpf:()=>{const u=S.user;Object.assign(S.f,{p_nm:u.name,p_em:u.email||'',p_ph:u.phone||'',p_ct:u.city||'',p_tr:u.track||'',p_bio:u.bio||''});S.err=false;S.view='pf';$('#scr').scrollTo({top:0})},
savepf:()=>{const n=(S.f.p_nm||'').trim(),e=(S.f.p_em||'').trim();if(!n||!/^\S+@\S+\.\S+$/.test(e)){S.err=true;return}S.err=false;const o=nm();
 if(o!==n){S.clubs.forEach(c=>{c.mem=c.mem.map(x=>x===o?n:x);if(c.ow===o)c.ow=n});S.groups.forEach(g=>g.msgs.forEach(m=>{if(m.u===o)m.u=n}));S.gigs.forEach(g=>{if(g.u===o)g.u=n});S.appts.forEach(a=>{if(a.u===o)a.u=n})}
 Object.assign(S.user,{name:n,email:e,phone:(S.f.p_ph||'').trim(),city:(S.f.p_ct||'').trim(),track:(S.f.p_tr||'').trim(),bio:(S.f.p_bio||'').trim()});save();toast(t('pf_ok'))},
rmav:()=>{delete S.user.av;save()},setmode:v=>{S.theme=v;save()},setac:v=>{S.th.ac=v;save()},setz:v=>{S.th.z=+v;save()},setr:v=>{S.th.r=+v;save()},rsth:()=>{S.th=Object.assign({},DTH);save()},
grp:v=>{S.g=+v;S.view='forum'},theme:()=>{S.theme=S.theme==='dark'?'light':'dark';save()},
mode:v=>{S.mode=v;S.err=false},role:v=>S.role=v,
auth:()=>{const em=(S.f.em||'').trim(),pw=S.f.pw||'';if(!/^\S+@\S+\.\S+$/.test(em)||pw.length<6){S.err=true;return}
  S.err=false;S.user={role:S.role,email:em,name:(S.mode==='up'&&(S.f.nm||'').trim())||NM[S.role]};S.view='dash';S.f={};save()},
demo:v=>{S.user={role:v,name:NM[v]};S.view='dash';S.f={};S.rec=false;save()},
logout:()=>{S.user=null;S.f={};S.rec=false;save()},
emot:()=>S.emo=!S.emo,emo:v=>{S.f.msg=(S.f.msg||'')+v},mic:()=>{toggleRec()},call:()=>startCall(p(S.groups[S.g].n)),
send:()=>{const m=(S.f.msg||'').trim();if(!m)return;post({t:m});S.f.msg='';S.emo=false},
delmsg:(v,el)=>{S.groups[+v].msgs.splice(+el.dataset.w,1)},
pub:()=>{const h=(S.f.at||'').trim(),b=(S.f.ab||'').trim();if(!h||!b){toast(t('fill'));return}S.anns.unshift({k:S.f.ap?1:0,d:[now(),now(),now()],h:[h,h,h],b:[b,b,b]});S.f.at=S.f.ab='';S.f.ap=false;toast(t('ok2'))},
delann:v=>S.anns.splice(+v,1),
joinm:v=>startCall(S.meets[+v].t),
meet:()=>{if(!(S.f.mt||'').trim()||!S.f.md||!S.f.mh){toast(t('fill'));return}S.meets.push({t:S.f.mt.trim(),d:S.f.md,h:S.f.mh});S.f.mt=S.f.md=S.f.mh='';toast(t('ok2'))},
mkclub:()=>{const n=(S.f.cn||'').trim();if(!n){toast(t('fill'));return}S.clubs.unshift({n,d:(S.f.cd||'').trim()||n,ty:S.f.ct||'c',ow:nm(),mem:[nm()]});S.f.cn=S.f.cd='';toast(t('ok2'))},
joinclub:v=>{const c=S.clubs[+v],i=c.mem.indexOf(nm());i<0?c.mem.push(nm()):c.mem.splice(i,1)},delclub:v=>S.clubs.splice(+v,1),
apply:v=>{S.applied[v]=true;toast(t('apd'))},offer:v=>{S.offered[v]=true;toast(t('ofd'))},
mkgig:()=>{const h=(S.f.gt||'').trim(),b=parseInt(S.f.gb,10);if(!h||!(b>=0)){toast(t('fill'));return}S.gigs.unshift({h,u:nm(),me:true,p:b});S.offered={};S.f.gt=S.f.gb='';toast(t('ok2'))},
book:()=>{if(!S.f.rd||!(S.f.rw||'').trim()){toast(t('fill'));return}S.appts.unshift({u:nm(),v:+(S.f.sv||0),d:S.f.rd,s:S.f.rs||SLOTS[0],w:S.f.rw.trim(),st:'p'});S.f.rd=S.f.rw='';toast(t('bk'))},
rvok:v=>S.appts[+v].st='a',rvno:v=>S.appts[+v].st='r'
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT'||b.closest('.call'))return;const pv=S.view;A[b.dataset.a](b.dataset.v,b);if(S.view!==pv&&S.user)history.pushState({v:S.view},'');render()});
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='lang'){S.lang=el.value;save();render()}
  else if(el.id==='p_col'){S.th.ac=el.value;save();render()}
  else if(el.id==='pav'&&el.files[0]){resizeAv(el.files[0])}
  else if(el.id==='fl'&&el.files[0]){const f=el.files[0],k=f.type.startsWith('image')?'img':f.type.startsWith('video')?'vid':'file';post({k,src:URL.createObjectURL(f),name:f.name,sz:f.size});render()}
  else if(el.id==='dp'&&el.files[0]){const f=el.files[0];S.docs.unshift({n:f.name,sz:f.size});toast(t('ok2'));render()}});
document.addEventListener('input',e=>{const el=e.target;if(el.id&&el.type!=='file'){S.f[el.id]=el.type==='checkbox'?el.checked:el.value}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='msg'){A.send();render()}else if(!S.user&&e.target.tagName==='INPUT'){A.auth();render()}});
history.replaceState({v:'dash'},'');addEventListener('popstate',e=>{S.view=(e.state&&e.state.v)||'dash';render()});
const isIn=x=>x&&/INPUT|TEXTAREA/.test(x.tagName)&&x.type!=='file';
addEventListener('focusin',e=>{if(isIn(e.target))document.body.classList.add('kb')});
addEventListener('focusout',()=>setTimeout(()=>{if(!isIn(document.activeElement))document.body.classList.remove('kb')},60));
render();
const tick=()=>{const d=new Date();$('#clk').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};tick();setInterval(tick,3e4);
const fit=()=>document.querySelector('.dev').style.setProperty('--k',Math.min(1,(innerHeight-56)/870,(innerWidth-48)/430));fit();addEventListener('resize',fit);
</script>
</body>
